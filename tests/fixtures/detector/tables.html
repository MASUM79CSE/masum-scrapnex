<!doctype html>
<html lang="en">
  <title>Field inventory tables</title>
  <main>
    <table>
      <caption>
        Field inventory
      </caption>
      <thead>
        <tr>
          <th rowspan="2">Item</th>
          <th colspan="2">Stock</th>
        </tr>
        <tr>
          <th>Warehouse</th>
          <th>Shop</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Trail lamp</td>
          <td>12</td>
          <td>3</td>
        </tr>
        <tr>
          <td>4</td>
          <td></td>
        </tr>
        <tr>
          <td>সরঞ্জাম</td>
          <td>7</td>
        </tr>
        <tr>
          <td>Camp mat</td>
          <td hidden>hidden quantity</td>
          <td>5</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">Inventory footer should not be included</td>
        </tr>
      </tfoot>
    </table>
    <table>
      <tbody>
        <tr>
          <td>Pack</td>
          <td>৳4000</td>
        </tr>
        <tr>
          <td>Mug</td>
          <td>৳850</td>
        </tr>
      </tbody>
    </table>
    <table role="presentation">
      <tr>
        <td>Layout cell A</td>
        <td>Layout cell B</td>
      </tr>
      <tr>
        <td>Layout cell C</td>
        <td>Layout cell D</td>
      </tr>
    </table>
    <table hidden>
      <tr>
        <td>Hidden A</td>
        <td>Hidden B</td>
      </tr>
      <tr>
        <td>Hidden C</td>
        <td>Hidden D</td>
      </tr>
    </table>
  </main>
</html>
