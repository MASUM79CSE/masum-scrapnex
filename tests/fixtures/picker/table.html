<!doctype html>
<html lang="en">

    body {
      font: 16px system-ui;
      margin: 35px;
      color: #142634;
    }
    table {
      border-collapse: collapse;
    }
    th,
    td {
      border: 1px solid #ccc;
      padding: 10px 20px;
    }

  <main>

      <table aria-label="Inventory">

        <tbody>
          <tr id="first">
            <td>সরঞ্জাম</td>
            <td data-price="13">13</td>
          </tr>
          <tr id="second">
            <td>Camp mug</td>
            <td data-price="21">21</td>
          </tr>
          <tr id="third">
            <td>Cooking set</td>

        </tbody>
      </table>
    </section>
  </main>
</html>
